<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lead Qualification & Intent Scorer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>AI Lead Qualification & Intent Scorer</h1>
        <p>Automated B2B prospect scoring, buying-signal extraction, and sales routing</p>
      </div>
      <span class="badge">Revenue Intelligence v1.0</span>
    </header>

    <!-- KPI Cards -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Leads Evaluated</div>
        <div class="kpi-value" id="kpiTotal">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Hot / Sales-Ready (SQL)</div>
        <div class="kpi-value" id="kpiHot" style="color: var(--hot);">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Average Lead Score</div>
        <div class="kpi-value" id="kpiAvg">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Est. Pipeline Value</div>
        <div class="kpi-value" id="kpiPipeline" style="color: var(--accent-cyan);">$0</div>
      </div>
    </section>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left: Inbound Lead Form -->
      <section class="panel">
        <div class="panel-title">
          <span>Score Inbound Lead</span>
          <button class="btn-secondary btn-sm" id="sampleBtn">Auto-Fill Sample</button>
        </div>

        <form id="leadForm" class="lead-form">
          <div class="form-row">
            <div class="form-group">
              <label for="leadName">Contact Name & Role</label>
              <input type="text" id="leadName" placeholder="e.g., Sarah Jenkins, VP of Ops" required />
            </div>
            <div class="form-group">
              <label for="companySize">Company Size</label>
              <select id="companySize">
                <option value="enterprise">Enterprise (500+ employees)</option>
                <option value="midmarket" selected>Mid-Market (50–499 employees)</option>
                <option value="smb">Small Business (10–49 employees)</option>
                <option value="startup">Early Startup (1–9 employees)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="leadMessage">Inbound Inquiry / Discovery Notes</label>
            <textarea
              id="leadMessage"
              placeholder="Paste demo request, email inquiry, or CRM form note..."
              required
            ></textarea>
          </div>

          <div class="controls">
            <button type="submit" class="btn-primary">Calculate Lead Score</button>
            <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
          </div>
        </form>
      </section>

      <!-- Right: Scored Pipeline Feed -->
      <section class="panel">
        <div class="panel-title">
          <span>Prioritized Lead Queue</span>
          <button class="btn-secondary btn-sm" id="exportBtn">Export CSV</button>
        </div>
        <div class="feed-list" id="leadQueue"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
